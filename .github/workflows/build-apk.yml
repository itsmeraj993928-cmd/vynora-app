name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2g"
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Add Gemini key (from GitHub secret, if set)
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_KEY" ]; then echo "GEMINI_API_KEY=$GEMINI_KEY" > .env; fi
      - name: Add Pexels key (from GitHub secret, if set)
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -n "$PEXELS_KEY" ]; then echo "PEXELS_API_KEY=$PEXELS_KEY" >> .env; fi
      - name: Build APK
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            gradle assembleRelease --no-daemon --no-watch-fs
            cp app/build/outputs/apk/release/app-release.apk vynora.apk
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            gradle assembleDebug --no-daemon --no-watch-fs
            cp app/build/outputs/apk/debug/app-debug.apk vynora.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: vynora.apk
      - name: Publish download link (GitHub Release)
        if: env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" vynora.apk \
            --title "Vynora build ${{ github.run_number }}" \
            --notes "Latest Vynora APK" --latest
